# /etc/systemd/system/brain-api.service.d/rls.conf  (the brain host)
# RLS cutover — the single env flip that makes brain-api connect to Postgres as the
# NON-owner role `brain_app`, so Row-Level Security policies actually bite (the table owner
# bypasses RLS; a non-owner does not). Rollback = delete this drop-in + `systemctl daemon-reload
# && systemctl restart brain-api` (brain-api then reconnects as the owner and RLS is inert again).
[Service]
Environment=BRAIN_DB_USER=brain_app
