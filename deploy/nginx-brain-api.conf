# /etc/nginx/sites-available/brain-api on the brain host.
# mTLS transport front for the governance API. Mesh listener :8443.
# Server cert = your TLS leaf (CN = your brain host, SAN = your brain IP).
# Client certs verified against the local CA; CN passed to the app as X-SSL-Client-CN.

# extract CN from the verified client DN (e.g. "CN=agent-name")
map $ssl_client_s_dn $brain_client_cn {
    default "";
    "~CN=(?<c>[^,]+)" "$c";
}
server {
    listen 8443 ssl;
    server_name brain.example.com;

    ssl_certificate        /opt/brain-db/pki/server.crt;       # leaf + local CA (fullchain)
    ssl_certificate_key    /opt/brain-db/pki/server.key;
    ssl_client_certificate /opt/brain-db/pki/ca.crt;    # verify client certs against the local CA
    ssl_verify_client      optional;                       # required per-route below (so /enroll can be exempt)
    ssl_verify_depth       2;
    ssl_protocols          TLSv1.2 TLSv1.3;
    # TLS hardening: strong AEAD-only cipher suite (governs TLS 1.2; 1.3 uses its own AEAD defaults).
    ssl_ciphers            ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_ecdh_curve         X25519:prime256v1:secp384r1;
    ssl_session_cache      shared:SSL:10m;
    ssl_session_timeout    1d;
    ssl_session_tickets    off;
    # HSTS: this listener is HTTPS/mTLS-only — pin clients to TLS. `always` so it's sent on errors too.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # --- mTLS-EXEMPT bootstrap (brand-new agent has no cert yet) ---
    # exact matches only, so manager routes under /enroll/ are NOT exempted.
    location = /enroll {            # GET questionnaire + POST application
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-CN "";   # never trust a client-supplied CN here
    }
    location = /enroll/status {     # applicant poll — authed by its one-time enroll_secret, not a cert
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-CN "";
    }

    # --- manager enrollment routes (/enroll/pending, /enroll/<id>/approve): cert REQUIRED ---
    location /enroll/ {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-CN $brain_client_cn;
    }

    # --- everything else: real client cert REQUIRED + pass the verified CN ---
    location / {
        if ($ssl_client_verify != SUCCESS) { return 403; }
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-CN $brain_client_cn;
    }
}
