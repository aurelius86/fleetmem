# Public CI — a lightweight syntax gate for the open-source distribution.
# Verifies every Python source byte-compiles on a clean runner. The full
# integration + recall test suite runs in the maintainer's own pipeline.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compile:
    name: byte-compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Byte-compile all Python sources
        run: python -m compileall -q .
